name: Build QL-kho APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub's ubuntu-latest runner already provides Android SDK.
      # Avoid android-actions/setup-android because it was failing at sdkmanager setup.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.11.1"
          archive="$RUNNER_TEMP/gradle-$version-bin.zip"
          install_dir="$RUNNER_TEMP/gradle-$version"
          curl --fail --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 30 \
            "https://services.gradle.org/distributions/gradle-$version-bin.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QL-kho-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
